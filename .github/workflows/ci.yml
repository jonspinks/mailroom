name: CI

# A branch push that also opens or updates a pull request would otherwise
# run twice and mail a failure twice. Pull requests cover branches. Main
# covers the merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read the code, nothing more: the jobs only build and test.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The runner's own Ubuntu mirror can crawl: on 2026-11-18 four runs in a
      # row spent 15+ minutes here, seconds per small package, and never got
      # through WebKit. Use kernel.org's mirror, then Ubuntu's own; keep the
      # packages between runs, even from a run that timed out; and fail after
      # 15 minutes instead of waiting out GitHub's six hours.
      - name: Restore system packages
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-debs
          key: apt-ubuntu-24.04-webkit41-v1-${{ github.run_id }}
          restore-keys: apt-ubuntu-24.04-webkit41-v1-
      - name: System libraries
        timeout-minutes: 15
        run: |
          printf 'http://mirrors.edge.kernel.org/ubuntu/\tpriority:1\nhttp://archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          mkdir -p ~/apt-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - name: Save system packages
        if: always()
        run: cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
      # A cache can't be overwritten, so each run saves its own and the next
      # restores the newest.
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/apt-debs
          key: apt-ubuntu-24.04-webkit41-v1-${{ github.run_id }}
      # Third-party actions are pinned to a commit (Dependabot updates them).
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install
        working-directory: e2e
        run: npm ci
      - name: Browser tests
        working-directory: e2e
        env:
          CHROME: /usr/bin/google-chrome
        run: node run.mjs

name: Security

# Weekly, and on every pull request: known vulnerabilities in the Rust and
# npm dependencies, and secrets committed by mistake.
on:
  schedule:
    - cron: "41 6 * * 1"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit (RustSec advisory database)
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

  npm-advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit (test harness)
        working-directory: e2e
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<script>
// Up to 0.35 this app was Nowtlook and kept its settings under "nowtlook-"
// keys. Move them to "mailroom-" before anything (here or in app.js) reads one; a key
// already saved under the new name wins.
(function moveOldSettings() {
  try {
    const old = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith("nowtlook-")) old.push(key);
    }
    old.forEach(key => {
      const next = "mailroom-" + key.slice("nowtlook-".length);
      if (localStorage.getItem(next) === null) localStorage.setItem(next, localStorage.getItem(key));
      localStorage.removeItem(key);
    });
  } catch (e) {}
})();

(function () {
  var theme = "dark";
  try {
    var saved = localStorage.getItem("mailroom-theme");
    if (saved === "light" || saved === "dark" || saved === "system") theme = saved;
    // Following Omarchy: paint the last theme seen before app.js asks again.
    if (saved === "omarchy") {
      theme = localStorage.getItem("mailroom-omarchy-mode") === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-look", "omarchy");
      var vars = JSON.parse(localStorage.getItem("mailroom-omarchy-vars") || "{}");
      for (var key in vars) {
        if (/^--[a-z0-9-]+$/.test(key)) document.documentElement.style.setProperty(key, String(vars[key]));
      }
    }
  } catch (e) {}
  document.documentElement.setAttribute("data-theme", theme);
  var listWidth = "360px";
  try {
    var savedList = parseInt(localStorage.getItem("mailroom-list-width"), 10);
    if (savedList >= 280 && savedList <= 1600) listWidth = savedList + "px";
  } catch (e) {}
  document.documentElement.style.setProperty("--list-width", listWidth);
  if (/[?&]assist=1(?:&|$)/.test(location.search)) document.documentElement.setAttribute("data-assist", "window");
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mailroom</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="mail" data-folders="open">
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg width="28" height="28" viewBox="24 24 464 464"><defs><linearGradient id="app-mark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b88d8"/><stop offset="1" stop-color="#0f6cbd"/></linearGradient></defs><rect x="24" y="24" width="464" height="464" rx="108" fill="url(#app-mark)"/><rect x="112" y="144" width="288" height="224" rx="30" fill="#fff" opacity="0.22"/><path d="M150 352 V160 L256 282 L362 160 V352" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    Mailroom <span class="ver" id="app-version">1.3.4</span><small>Unified mail for Omarchy</small>
  </div>
  <div class="search-wrap">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4"/></svg>
      <input id="q" type="search" placeholder="Search mail, people and calendar" autocomplete="off">
      <button class="search-toggle" type="button" id="search-toggle" aria-expanded="false" aria-controls="search-panel">Filters</button>
    </label>
    <div class="suggest" id="q-suggest" hidden></div>
    <div class="search-panel" id="search-panel" hidden>
      <label>Folder
        <select id="search-scope" aria-label="Search folder">
          <option value="">This folder</option>
          <option value="all">All folders</option>
        </select>
      </label>
      <label>Account
        <select id="search-account" aria-label="Search account">
          <option value="">Any account</option>
          <option value="timberworks">Timberworks</option>
          <option value="personal">Personal</option>
        </select>
      </label>
      <label>Attachments
        <select id="search-files" aria-label="Attachments">
          <option value="">Any</option>
          <option value="yes">Has attachments</option>
          <option value="no">No attachments</option>
        </select>
      </label>
      <label>From
        <input id="search-from" type="date" aria-label="From date">
      </label>
      <label>To
        <input id="search-to" type="date" aria-label="To date">
      </label>
      <div class="search-actions">
        <button class="ghost" type="button" id="search-clear">Clear filters</button>
      </div>
    </div>
  </div>
  <div class="top-actions">
    <button type="button" class="icon-btn assistant-top" id="assist-top" data-assistant-btn hidden aria-expanded="false" aria-controls="assist" title="Help me write" aria-label="Help me write"></button>
    <button type="button" class="icon-btn" id="theme-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu" title="Theme" aria-label="Theme">
      <svg class="theme-icon theme-system" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3.5" width="14" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 16.5h4M10 13.5v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg class="theme-icon theme-light" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.4v2M10 15.6v2M2.4 10h2M15.6 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg class="theme-icon theme-dark" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M14.6 12.4A5.3 5.3 0 0 1 7.8 5.2 5.4 5.4 0 1 0 14.6 12.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <svg class="theme-icon theme-omarchy" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 3.5H4.5v13H8M12 3.5h3.5v13H12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
    <div id="theme-menu" class="row-menu" role="menu" aria-label="Theme" hidden>
      <button type="button" role="menuitemradio" data-theme="system" aria-checked="false">System</button>
      <button type="button" role="menuitemradio" data-theme="light" aria-checked="false">Light</button>
      <button type="button" role="menuitemradio" data-theme="dark" aria-checked="true">Dark</button>
      <button type="button" role="menuitemradio" data-theme="omarchy" aria-checked="false" id="theme-omarchy" hidden>Omarchy</button>
    </div>
  </div>
</header>
<p class="auth-banner" id="auth-banner" role="status" hidden></p>
<div class="shell">
  <nav class="rail" aria-label="Apps">
    <button type="button" id="rail-mail" aria-pressed="true" title="Mail" aria-label="Mail">
      <svg width="20" height="20" viewBox="0 0 20 20"><rect x="2.5" y="4.5" width="15" height="11" rx="1.2" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M3 5.5l7 6 7-6" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
    </button>
    <button type="button" id="rail-cal" aria-pressed="false" title="Calendar" aria-label="Calendar">
      <svg width="20" height="20" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="13" rx="1.2" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M3 8h14M7 3v3M13 3v3" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <button type="button" id="rail-people" aria-pressed="false" title="People" aria-label="People">
      <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="7" r="2.6" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M4.5 16.2c.8-2.6 2.8-4 5.5-4s4.7 1.4 5.5 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
    </button>
    <button type="button" id="rail-settings" aria-pressed="false" title="Settings" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M8.7 1.7h2.6l.4 1.9c.4.1.8.3 1.2.6l1.8-.8 1.8 1.8-.8 1.8c.3.4.5.8.6 1.2l1.9.4v2.6l-1.9.4a5 5 0 01-.6 1.2l.8 1.8-1.8 1.8-1.8-.8a5 5 0 01-1.2.6l-.4 1.9H8.7l-.4-1.9a5 5 0 01-1.2-.6l-1.8.8-1.8-1.8.8-1.8a5 5 0 01-.6-1.2l-1.9-.4V8.7l1.9-.4c.1-.4.3-.8.6-1.2l-.8-1.8 1.8-1.8 1.8.8c.4-.3.8-.5 1.2-.6l.4-1.9zM10 7.3a2.7 2.7 0 100 5.4 2.7 2.7 0 000-5.4z"/></svg>
    </button>
  </nav>
  <aside class="folders" id="folders">
    <div class="folders-split" id="folders-split" role="separator" aria-orientation="vertical" aria-label="Resize the folder pane" tabindex="0" title="Drag to resize. Double-click to reset."></div>
    <div class="folder-tools">
      <button type="button" id="hide-folders" title="Hide folders" aria-label="Hide folders" aria-expanded="true">
        <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="folder-nav"></div>
  </aside>
  <section class="list" aria-label="Messages">
    <div class="list-head">
      <button type="button" class="list-show-folders" id="show-mail-folders" title="Show folders" aria-label="Show folders">
        <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="list-titles">
        <h1 id="list-title">All inboxes</h1>
        <div class="search-summary" id="search-summary" hidden></div>
        <div class="focus-tabs" id="focus-tabs" role="tablist" aria-label="Focused Inbox" hidden>
          <button type="button" role="tab" data-focus-tab="focused" aria-selected="true">Focused</button>
          <button type="button" role="tab" data-focus-tab="other" aria-selected="false">Other<span class="focus-count" id="focus-other-count"></span></button>
        </div>
      </div>
      <label class="list-filter">Filter
        <select id="mail-filter" aria-label="Filter mail">
          <option value="">All</option>
          <option value="unread">Unread</option>
          <option value="read">Read</option>
          <option value="flagged">Flagged</option>
          <option value="events">Events</option>
        </select>
      </label>
      <button class="icon-btn check-mail" type="button" id="check-mail" title="Check for new mail (F5)" aria-label="Check for new mail"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M15.6 8.2A6 6 0 0 0 4.6 6.4M4.4 11.8a6 6 0 0 0 11 1.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M4.2 3.2v3.6h3.6M15.8 16.8v-3.6h-3.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="followup-bar" id="followup-bar" role="status" hidden></div>
    <div class="search-extras" id="search-extras" hidden></div>
    <div id="rows"></div>
  </section>
  <div class="pane-split" id="pane-split" role="separator" aria-orientation="vertical" aria-label="Resize the message list" aria-valuemin="280" aria-valuemax="1600" aria-valuenow="360" tabindex="0" title="Drag to resize. Double-click to reset."></div>
  <article class="reading" id="reading" aria-live="polite"></article>
  <section class="calendar" aria-label="Week of 12 October">
    <div class="cal-head">
      <button type="button" class="cal-show-folders" id="show-cal-folders" title="Show folders" aria-label="Show folders">
        <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <h1 id="cal-title">12–16 October 2026</h1>
      <div class="toolbar cal-nav">
        <button class="ghost" type="button" id="cal-today">Today</button>
        <button class="icon-btn" type="button" id="cal-prev" title="Previous week" aria-label="Previous week"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8 10 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="icon-btn" type="button" id="cal-next" title="Next week" aria-label="Next week"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="seg" role="group" aria-label="Calendar view">
          <button type="button" data-cal-view="work" aria-pressed="true">Work week</button>
          <button type="button" data-cal-view="week" aria-pressed="false">Week</button>
          <button type="button" data-cal-view="month" aria-pressed="false">Month</button>
        </div>
      </div>
    </div>
    <div class="cal-scroll" id="cal"></div>
  </section>
  <section class="settings" id="settings" aria-label="Settings">
    <div class="cal-head">
      <h1 id="settings-title">Accounts</h1>
    </div>
    <div class="settings-body" id="settings-body"></div>
    <p class="settings-foot">Version <span id="settings-version">1.3.4</span></p>
  </section>
</div>
<div id="pop-root"></div>
<aside id="assist" aria-label="Help me write">
  <div class="assist-bar">
    <span class="assist-title" id="assist-title">Help me write</span>
    <span class="assist-spacer"></span>
    <button type="button" class="icon-btn" id="assist-pop" title="Pop out" aria-label="Pop out"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M8.2 4.6H4.8v10.6h10.6V11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M10.6 9.4L15.6 4.4M12.2 4.4h3.4V7.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="icon-btn" id="assist-close" title="Close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
  <div class="assist-log" id="assist-log">
    <div class="assist-empty"><p>What do you need help with?</p><p>Ask for a draft, a rewrite, or a shorter reply. Nothing is sent until you press Send on the message.</p></div>
  </div>
  <form class="assist-compose" id="assist-form">
    <textarea id="assist-input" rows="3" placeholder="What do you need help with?" aria-label="What do you need help with?"></textarea>
    <button class="primary" type="submit" id="assist-send" aria-label="Send to the assistant">Send</button>
  </form>
</aside>
<div id="row-menu" class="row-menu" role="menu" hidden></div>
<script src="app.js"></script>
</body>
</html>
